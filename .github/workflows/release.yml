# Builds BitcoinWallpaper.exe on GitHub's own Windows machines and
# attaches it to a Release, so nobody has to trust an .exe built on
# someone's personal PC -- the build log is public and repeatable.
#
# Runs when you push a version tag, e.g.:
#     git tag v1.1.0
#     git push origin v1.1.0
# or by hand from the repo's Actions tab ("Run workflow"), which builds
# and tests the .exe without publishing a Release.

name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The job only needs to read the code and write the Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party steps are pinned to an exact commit (not a movable
      # version tag) so they can't change underneath us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build BitcoinWallpaper.exe
        run: pyinstaller --noconfirm BitcoinWallpaper.spec

      - name: Smoke test (does the .exe actually serve the app?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BitcoinWallpaper.exe -ArgumentList "--no-browser" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing
                if ($r.StatusCode -eq 200 -and $r.Content -match "Bitcoin Wallpaper") { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "index.html was not served" }
            foreach ($f in "app.js", "style.css", "fonts/vt323-latin-400-normal.woff2") {
              $r = Invoke-WebRequest "http://127.0.0.1:8080/$f" -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$f was not served" }
            }
            Write-Host "Smoke test passed."
          } finally {
            taskkill /PID $p.Id /T /F | Out-Null
          }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BitcoinWallpaper.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BitcoinWallpaper.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitcoinWallpaper-windows
          path: |
            dist/BitcoinWallpaper.exe
            dist/SHA256SUMS.txt

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/BitcoinWallpaper.exe dist/SHA256SUMS.txt --clobber
