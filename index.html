<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Wallpaper</title>
<!--
  Content-Security-Policy: tells the browser what this page is allowed
  to load and run. Scripts, styles, fonts and images may only come from
  this app's own folder ('self') - nothing inline, nothing third-party.
  connect-src is left open to any http(s)/ws(s) host because the data
  source (your node's address) is user-configured and can't be known
  here; that only permits fetching DATA, not running code.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src http: https: ws: wss:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<div id="overlay">
    <h1>Bitcoin Wallpaper <span id="appVersion" class="version"></span></h1>
    <div id="stats">
        <div><span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span></div>
        <div>Block: <span id="blockHeight">–</span></div>
        <div>Mempool tx: <span id="txCount">–</span> (<span id="tileCount">–</span> tiles rendered)</div>
        <div>Mempool size: <span id="vsize">–</span> MB</div>
        <div>Medium fee: <span id="nextFee">–</span> sat/vB</div>
        <div>Network hashrate: <span id="hashrate">–</span></div>
        <div>Time: <span id="updated">–</span></div>
    </div>
    <div id="hint">o = hide overlay &nbsp;·&nbsp; f = fullscreen &nbsp;·&nbsp; hover a tile for detail</div>
</div>

<div id="bottomLeftStack">
    <div id="bigBlockNumber" class="hidden">–</div>
    <div id="legend">
        <div id="legendLabel">Fee rate</div>
        <div id="legendBar"></div>
        <div id="legendLabels"><span>lower</span><span>higher</span></div>
    </div>
</div>

<button id="settingsToggle" title="Settings">⚙</button>
<div id="settingsPanel" class="hidden"></div>

<div id="tooltip" class="hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
